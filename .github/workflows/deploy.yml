name: La Vurger Post-MVP Production Lifecycle

on:
  push:
    branches:
      - main

jobs:
  test_and_quality:
    name: 🧪 Run Tests & SonarQube Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

          
      - name: 🛡️ SonarQube Analysis (Backend)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=minea-dev_la-vurger-app \
            -Dsonar.organization=minea-dev \
            -Dsonar.host.url=https://sonarcloud.io \
            -DskipTests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Deps
        working-directory: ./frontend
        run: npm install

      - name: 📦 Build Frontend Assets
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: 🐳 Start Test Environment in Actions
        run: |
          docker compose up -d --build
          sleep 15

      - name: 🌐 Serve Frontend Dev Ports for Playwright
        working-directory: ./frontend
        run: |
          npm install -g serve
          CLIENT_DIR=$([ -d "dist/lavurger-client/browser" ] && echo "dist/lavurger-client/browser" || echo "dist/lavurger-client")
          ADMIN_DIR=$([ -d "dist/lavurger-admin/browser" ] && echo "dist/lavurger-admin/browser" || echo "dist/lavurger-admin")
          nohup serve -s $CLIENT_DIR -l 4200 > client.log 2>&1 &
          nohup serve -s $ADMIN_DIR -l 4201 > admin.log 2>&1 &
          sleep 5

      - name: 🎭 Run Playwright E2E Tests
        working-directory: ./frontend
        run: npx playwright test --workers=1

      - name: 🧹 Clean Test Environment
        if: always()
        run: docker compose down

  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: test_and_quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2 server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".,!**/node_modules/**,!**/target/**"
          target: "/home/ubuntu/la-vurger-app"

      - name: Run Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop nginx || true
            sudo systemctl disable nginx || true
            
            cd /home/ubuntu/la-vurger-app
            
            echo "DB_URL=${{ secrets.DB_URL }}" > .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            
            sudo docker compose down
            sudo docker system prune -f
            
            sudo docker compose up -d --build --force-recreate
            sleep 5 && sudo docker logs lavurger-front
