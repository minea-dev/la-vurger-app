name: Deploy La Vurger MVP

on:
  push:
    branches:
      - main

jobs:
  test:
    name: 🧪 Run Tests (Blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build Backend and Skip Tests
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Frontend Tests (Angular)
        working-directory: ./frontend
        run: |
          npm install
          npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: test # Only runs if the above tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2 server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/la-vurger-app"

      - name: Run Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/la-vurger-app
            
            # Safely recreate the .env file on the server
            echo "DB_URL=${{ secrets.DB_URL }}" > .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            
            # Stop old containers and start the new ones
            docker compose down
            docker compose up -d --build