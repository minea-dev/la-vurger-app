<div class="absolute inset-0 flex flex-col bg-admin-bg overflow-hidden">

  <div class="px-4 py-3 bg-admin-white border-b border-admin-border flex items-center gap-2.5 shrink-0">
    <div class="text-[14px] font-bold text-admin-text mr-1">Catàleg de productes</div>

    <input type="text" placeholder="Cercar producte..."
           [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()"
           class="h-[34px] px-3 border border-admin-border rounded-md bg-admin-bg text-[13px] text-admin-text outline-none w-[200px] transition-colors focus:border-admin-blue focus:bg-admin-white">

    <div class="flex gap-1 ml-2">
      <button (click)="setCategory('Tots')" [class.bg-admin-blue]="selectedCategory === 'Tots'" [class.text-white]="selectedCategory === 'Tots'" [class.bg-admin-white]="selectedCategory !== 'Tots'" class="h-[28px] px-3 rounded-full text-[12px] font-medium border border-admin-border text-admin-text2 transition-colors">Tots</button>
      <button (click)="setCategory('burgers')" [class.bg-admin-blue]="selectedCategory === 'burgers'" [class.text-white]="selectedCategory === 'burgers'" [class.bg-admin-white]="selectedCategory !== 'burgers'" class="h-[28px] px-3 rounded-full text-[12px] font-medium border border-admin-border text-admin-text2 transition-colors">Burguers</button>
      <button (click)="setCategory('burritos')" [class.bg-admin-blue]="selectedCategory === 'burritos'" [class.text-white]="selectedCategory === 'burritos'" [class.bg-admin-white]="selectedCategory !== 'burritos'" class="h-[28px] px-3 rounded-full text-[12px] font-medium border border-admin-border text-admin-text2 transition-colors">Burritos</button>
      <button (click)="setCategory('sides')" [class.bg-admin-blue]="selectedCategory === 'sides'" [class.text-white]="selectedCategory === 'sides'" [class.bg-admin-white]="selectedCategory !== 'sides'" class="h-[28px] px-3 rounded-full text-[12px] font-medium border border-admin-border text-admin-text2 transition-colors">Acomp.</button>
      <button (click)="setCategory('drinks')" [class.bg-admin-blue]="selectedCategory === 'drinks'" [class.text-white]="selectedCategory === 'drinks'" [class.bg-admin-white]="selectedCategory !== 'drinks'" class="h-[28px] px-3 rounded-full text-[12px] font-medium border border-admin-border text-admin-text2 transition-colors">Begudes</button>
      <button (click)="setCategory('desserts')" [class.bg-admin-blue]="selectedCategory === 'desserts'" [class.text-white]="selectedCategory === 'desserts'" [class.bg-admin-white]="selectedCategory !== 'desserts'" class="h-[28px] px-3 rounded-full text-[12px] font-medium border border-admin-border text-admin-text2 transition-colors">Postres</button>
    </div>

    <div class="flex-1"></div>

    <button (click)="openAddModal()" class="h-[34px] px-4 rounded-md bg-admin-blue text-white text-[12px] font-semibold flex items-center gap-1.5 transition-colors hover:bg-[#084f9a]">
      <svg class="w-[13px] h-[13px] stroke-white" stroke-width="2.5" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/></svg>
      Nou producte
    </button>
  </div>

  <div class="flex-1 overflow-y-auto scrollbar-thin bg-admin-white">
    <div *ngIf="errorMessage" class="p-4 bg-admin-red-lt text-admin-red text-sm font-semibold border-b border-admin-red/20">{{ errorMessage }}</div>

    <table class="w-full border-collapse text-left">
      <thead class="sticky top-0 z-10">
      <tr>
        <th class="px-4 py-2.5 text-[11px] font-semibold text-admin-text3 uppercase tracking-[0.8px] border-b-2 border-admin-border bg-admin-white">Producte</th>
        <th class="px-4 py-2.5 text-[11px] font-semibold text-admin-text3 uppercase tracking-[0.8px] border-b-2 border-admin-border bg-admin-white">Categoria</th>
        <th class="px-4 py-2.5 text-[11px] font-semibold text-admin-text3 uppercase tracking-[0.8px] border-b-2 border-admin-border bg-admin-white">Preu</th>
        <th class="px-4 py-2.5 text-[11px] font-semibold text-admin-text3 uppercase tracking-[0.8px] border-b-2 border-admin-border bg-admin-white">Stock</th>
        <th class="px-4 py-2.5 text-[11px] font-semibold text-admin-text3 uppercase tracking-[0.8px] border-b-2 border-admin-border bg-admin-white">Accions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let product of filteredProducts" class="border-b border-admin-border hover:bg-[#F8FAFB] transition-colors group">
        <td class="px-4 py-3 align-middle">
          <div class="font-semibold text-[14px] text-admin-text">{{ product.name }}</div>
          <div class="text-[12px] text-admin-text3 mt-0.5">{{ product.description || 'Sense descripció' }}</div>
        </td>
        <td class="px-4 py-3 align-middle">
         <span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded"
               [ngClass]="{
                  'bg-[#FFF3E0] text-[#E65100]': product.category.toLowerCase() === 'burgers',
                  'bg-[#FFF8E1] text-[#F57F17]': product.category.toLowerCase() === 'burritos',
                  'bg-[#F3E5F5] text-[#6A1B9A]': product.category.toLowerCase() === 'sides',
                  'bg-admin-blue-lt text-admin-blue': product.category.toLowerCase() === 'drinks',
                  'bg-[#E8EAF6] text-[#283593]': product.category.toLowerCase() === 'desserts'
                }">
            {{ getCategoryName(product.category) }}
         </span>
        </td>
        <td class="px-4 py-3 align-middle font-semibold text-[13px] text-admin-text">€{{ product.price | number:'1.2-2' }}</td>
        <td class="px-4 py-3 align-middle">
          <button (click)="toggleProduct(product)" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all border border-transparent select-none"
                  [ngClass]="product.isAvailable ? 'bg-admin-green-lt text-admin-green' : 'bg-admin-red-lt text-admin-red'">
            <div class="w-1.5 h-1.5 rounded-full bg-current"></div>
            {{ product.isAvailable ? 'Disponible' : 'Exhaurit' }}
          </button>
        </td>
        <td class="px-4 py-3 align-middle">
          <div class="flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
            <div (click)="openEditDrawer(product)" class="w-[30px] h-[30px] rounded-md border border-admin-border bg-admin-white flex items-center justify-center cursor-pointer hover:bg-admin-blue-lt text-admin-text3 hover:text-admin-blue">
              <svg class="w-[13px] h-[13px] stroke-current" stroke-width="2" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </div>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="isAddModalOpen" class="fixed inset-0 z-50 bg-black/35 flex items-center justify-center">
    <div class="w-[460px] bg-admin-white rounded-[10px] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-5 py-4 border-b border-admin-border flex items-center justify-between shrink-0">
        <div class="text-[15px] font-bold text-admin-text">Nou producte</div>
        <button (click)="closeAddModal()" class="w-[30px] h-[30px] border border-admin-border rounded-[5px] flex items-center justify-center hover:bg-admin-bg"><svg class="w-3.5 h-3.5 stroke-admin-text3" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="p-5 flex flex-col gap-3.5 overflow-y-auto">

        <div *ngIf="modalError" class="p-3 rounded-md bg-admin-red-lt border border-admin-red/20 text-[12px] font-semibold text-admin-red flex items-center gap-2">
          <svg class="w-4 h-4 stroke-current shrink-0" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          {{ modalError }}
        </div>

        <div><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Nom del producte</label>
          <input type="text" [(ngModel)]="selectedProduct.name" class="w-full h-[36px] px-3 border border-admin-border rounded-[5px] text-[13px] text-admin-text bg-admin-white outline-none focus:border-admin-blue">
        </div>

        <div class="flex gap-3">
          <div class="w-[100px] shrink-0"><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Preu (€)</label>
            <input type="number" [(ngModel)]="selectedProduct.price" class="w-full h-[36px] px-3 border border-admin-border rounded-[5px] text-[13px] text-admin-text bg-admin-white outline-none focus:border-admin-blue">
          </div>
          <div class="flex-1"><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Categoria</label>
            <select [(ngModel)]="selectedProduct.category" class="w-full h-[36px] px-3 border border-admin-border rounded-[5px] text-[13px] text-admin-text bg-admin-white outline-none focus:border-admin-blue">
              <option value="BURGERS">Burguers</option>
              <option value="BURRITOS">Burritos</option>
              <option value="SIDES">Acompanyaments</option>
              <option value="DRINKS">Begudes</option>
              <option value="DESSERTS">Postres</option>
            </select>
          </div>
        </div>

        <div><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Descripció</label>
          <textarea [(ngModel)]="selectedProduct.description" class="w-full p-3 border border-admin-border rounded-[5px] text-[13px] text-admin-text bg-admin-white outline-none focus:border-admin-blue" rows="3"></textarea>
        </div>
      </div>
      <div class="px-5 py-3.5 border-t border-admin-border flex justify-end gap-2 bg-admin-bg shrink-0">
        <button (click)="closeAddModal()" class="h-[34px] px-4 border border-admin-border rounded-[5px] bg-admin-white text-[12px] font-semibold text-admin-text2 hover:bg-admin-bg">Cancel·lar</button>
        <button (click)="saveNewProduct()" class="h-[34px] px-5 rounded-[5px] bg-admin-blue text-white text-[12px] font-semibold hover:bg-[#084f9a]">Desar producte</button>
      </div>
    </div>
  </div>

  <div class="absolute top-0 right-0 bottom-0 w-[340px] bg-admin-white border-l border-admin-border shadow-[-4px_0_16px_rgba(0,0,0,0.08)] flex flex-col z-20 transition-transform duration-200"
       [ngClass]="isEditDrawerOpen ? 'translate-x-0' : 'translate-x-full'">
    <div class="px-4 py-3.5 border-b border-admin-border flex items-center justify-between shrink-0">
      <div class="text-[14px] font-bold text-admin-text">Editar producte</div>
      <button (click)="closeEditDrawer()" class="w-[30px] h-[30px] border border-admin-border rounded-[5px] flex items-center justify-center hover:bg-admin-bg"><svg class="w-3.5 h-3.5 stroke-admin-text3" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3.5">

      <div *ngIf="modalError" class="p-3 rounded-md bg-admin-red-lt border border-admin-red/20 text-[12px] font-semibold text-admin-red flex items-center gap-2">
        <svg class="w-4 h-4 stroke-current shrink-0" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        {{ modalError }}
      </div>

      <div><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Nom del producte</label>
        <input type="text" [(ngModel)]="selectedProduct.name" class="w-full h-[36px] px-3 border border-admin-border rounded-[5px] text-[13px] outline-none focus:border-admin-blue">
      </div>

      <div class="flex gap-3">
        <div class="w-[100px] shrink-0"><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Preu (€)</label>
          <input type="number" [(ngModel)]="selectedProduct.price" class="w-full h-[36px] px-3 border border-admin-border rounded-[5px] text-[13px] outline-none focus:border-admin-blue">
        </div>
        <div class="flex-1"><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Categoria</label>
          <select [(ngModel)]="selectedProduct.category" class="w-full h-[36px] px-3 border border-admin-border rounded-[5px] text-[13px] outline-none focus:border-admin-blue">
            <option value="BURGERS">Burguers</option>
            <option value="BURRITOS">Burritos</option>
            <option value="SIDES">Acompanyaments</option>
            <option value="DRINKS">Begudes</option>
            <option value="DESSERTS">Postres</option>
          </select>
        </div>
      </div>

      <div><label class="block text-[12px] font-semibold text-admin-text2 mb-1.5">Descripció</label>
        <textarea [(ngModel)]="selectedProduct.description" class="w-full p-3 border border-admin-border rounded-[5px] text-[13px] outline-none focus:border-admin-blue" rows="3"></textarea>
      </div>
    </div>
    <div class="p-3 border-t border-admin-border flex gap-2 bg-admin-bg shrink-0">
      <button (click)="closeEditDrawer()" class="flex-1 h-[34px] border border-admin-border rounded-[5px] bg-admin-white text-[12px] font-semibold text-admin-text2 hover:bg-admin-bg">Descartar</button>
      <button (click)="updateProduct()" class="flex-[2] h-[34px] rounded-[5px] bg-admin-blue text-white text-[12px] font-semibold hover:bg-[#084f9a]">Desar canvis</button>
    </div>
  </div>

</div>
